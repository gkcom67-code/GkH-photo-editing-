<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GKH Photo Editing Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#08142b;
padding:15px;
color:#fff;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:15px;
}

.controls{
background:#182742;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

label{
display:block;
margin-top:10px;
margin-bottom:5px;
}

input[type=file],
input[type=range],
select{
width:100%;
margin-bottom:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#2563eb;
color:#fff;
font-size:16px;
cursor:pointer;
}

.preview{
position:relative;
background:#fff;
padding:2px;
border-radius:12px;
overflow:hidden;
touch-action:none;
}

.screens{
display:flex;
gap:2px;
}

.frame{
flex:1;
border:2px solid #2563eb;
border-radius:8px;
overflow:hidden;
background:#ddd;
}

.frame img{
width:100%;
display:block;
aspect-ratio:9/16;
object-fit:cover;
}

#logo{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:120px;
opacity:.35;
display:none;
z-index:10;
}

#emojiSticker{
position:absolute;
left:20px;
top:20px;
font-size:50px;
display:none;
z-index:999;
cursor:move;
user-select:none;
}

#customSticker{
position:absolute;
left:60px;
top:60px;
width:100px;
display:none;
z-index:999;
cursor:move;
}

.footer{
text-align:center;
margin-top:15px;
font-size:22px;
font-weight:bold;
}

.footer a{
text-decoration:none;
color:#60a5fa;
}

</style>
</head>
<body>

<div class="container">

<h1>GKH Photo Editing Pro</h1>

<div class="controls">

<label>Screenshot 1</label>
<input type="file" id="img1" accept="image/*">

<label>Screenshot 2</label>
<input type="file" id="img2" accept="image/*">

<label>Logo Upload</label>
<input type="file" id="logoInput" accept="image/*">

<label>
<input type="checkbox" id="toggleLogo" checked>
Show Logo
</label>

<label>Logo Size</label>
<input type="range" id="logoSize" min="50" max="300" value="120">

<label>Logo Opacity</label>
<input type="range" id="logoOpacity" min="10" max="100" value="35">

<label>Border Color</label>
<select id="borderColor">
<option value="#2563eb">Blue</option>
<option value="#ef4444">Red</option>
<option value="#22c55e">Green</option>
<option value="#eab308">Yellow</option>
<option value="#000000">Black</option>
</select>

<label>Background Color</label>
<select id="bgColor">
<option value="#ffffff">White</option>
<option value="#f3f4f6">Light Gray</option>
<option value="#dbeafe">Sky Blue</option>
<option value="#dcfce7">Mint Green</option>
</select>

<label>Emoji Sticker</label>
<select id="emojiSelect">
<option value="">Select Emoji</option>
<option>❤️</option>
<option>🔥</option>
<option>⭐</option>
<option>😊</option>
<option>😍</option>
<option>✔️</option>
<option>🎯</option>
<option>📌</option>
<option>🕌</option>
<option>🌙</option>
</select>

<label>
<input type="checkbox" id="toggleEmoji">
Show Emoji
</label>

<label>Emoji Size</label>
<input type="range" id="emojiSize" min="20" max="200" value="50">

<label>Custom Sticker Image</label>
<input type="file" id="stickerInput" accept="image/*">

<label>Sticker Size</label>
<input type="range" id="stickerSize" min="30" max="400" value="100">

<button onclick="downloadImage()">
PNG Download
</button>

</div>

<div class="preview" id="capture">

<div class="screens">

<div class="frame">
<img id="preview1">
</div>

<div class="frame">
<img id="preview2">
</div>

</div>

<img id="logo">

<div id="emojiSticker">❤️</div>

<img id="customSticker">

</div>

<div class="footer">
<a href="https://www.facebook.com/share/1B8xQqm9Pq/" target="_blank">
By Habibur Rahman
</a>
</div>

</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
  const preview1=document.getElementById("preview1");
const preview2=document.getElementById("preview2");

document.getElementById("img1")
.addEventListener("change",function(){

if(this.files[0]){

preview1.src=
URL.createObjectURL(this.files[0]);

}

});

document.getElementById("img2")
.addEventListener("change",function(){

if(this.files[0]){

preview2.src=
URL.createObjectURL(this.files[0]);

}

});

const logo=
document.getElementById("logo");

document.getElementById("logoInput")
.addEventListener("change",function(){

if(this.files[0]){

logo.src=
URL.createObjectURL(this.files[0]);

logo.style.display="block";

}

});

document.getElementById("toggleLogo")
.addEventListener("change",function(){

logo.style.display=
this.checked ? "block" : "none";

});

document.getElementById("logoSize")
.addEventListener("input",function(){

logo.style.width=
this.value+"px";

});

document.getElementById("logoOpacity")
.addEventListener("input",function(){

logo.style.opacity=
this.value/100;

});

document.getElementById("borderColor")
.addEventListener("change",function(){

document
.querySelectorAll(".frame")
.forEach(frame=>{

frame.style.borderColor=
this.value;

});

});

document.getElementById("bgColor")
.addEventListener("change",function(){

document.getElementById("capture")
.style.backgroundColor=
this.value;

});

const emojiSticker=
document.getElementById("emojiSticker");

document.getElementById("emojiSelect")
.addEventListener("change",function(){

emojiSticker.innerHTML=
this.value;

});

document.getElementById("toggleEmoji")
.addEventListener("change",function(){

emojiSticker.style.display=
this.checked ? "block" : "none";

});

document.getElementById("emojiSize")
.addEventListener("input",function(){

emojiSticker.style.fontSize=
this.value+"px";

});

const customSticker=
document.getElementById("customSticker");

document.getElementById("stickerInput")
.addEventListener("change",function(){

if(this.files[0]){

customSticker.src=
URL.createObjectURL(this.files[0]);

customSticker.style.display=
"block";

}

});

document.getElementById("stickerSize")
.addEventListener("input",function(){

customSticker.style.width=
this.value+"px";

});
  function makeDraggable(el){

let isDragging=false;
let startX=0;
let startY=0;
let initialLeft=0;
let initialTop=0;

function start(e){

isDragging=true;

const point=
e.touches ? e.touches[0] : e;

startX=point.clientX;
startY=point.clientY;

initialLeft=
parseInt(el.style.left)||el.offsetLeft;

initialTop=
parseInt(el.style.top)||el.offsetTop;

}

function move(e){

if(!isDragging) return;

e.preventDefault();

const point=
e.touches ? e.touches[0] : e;

const dx=
point.clientX-startX;

const dy=
point.clientY-startY;

el.style.left=
(initialLeft+dx)+"px";

el.style.top=
(initialTop+dy)+"px";

}

function stop(){

isDragging=false;

}

el.addEventListener("mousedown",start);
el.addEventListener("touchstart",start,{passive:false});

document.addEventListener("mousemove",move);
document.addEventListener("touchmove",move,{passive:false});

document.addEventListener("mouseup",stop);
document.addEventListener("touchend",stop);

}

makeDraggable(emojiSticker);
makeDraggable(customSticker);

function downloadImage(){

html2canvas(
document.getElementById("capture"),
{
scale:3,
useCORS:true
}
).then(function(canvas){

const link=
document.createElement("a");

link.download=
"gkh-photo-editing.png";

link.href=
canvas.toDataURL("image/png");

link.click();

});

}
</script>

</body>
</html>
