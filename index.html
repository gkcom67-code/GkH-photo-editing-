<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GKH Photo Editing Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
padding:15px;
color:#fff;
}

.container{
max-width:1100px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:15px;
font-size:24px;
}

.controls{
background:#1e293b;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.controls label{
display:block;
margin:8px 0 4px;
}

input[type=file],
input[type=range],
select{
width:100%;
padding:8px;
border:none;
border-radius:8px;
margin-bottom:8px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:#fff;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:5px;
}

.preview{
position:relative;
background:#fff;
padding:2px;
border-radius:10px;
overflow:hidden;
touch-action:none;
}

.screenshots{
display:flex;
gap:2px;
}

.frame{
flex:1;
background:#ddd;
border:1px solid #2563eb;
border-radius:6px;
overflow:hidden;
}

.frame img{
width:100%;
display:block;
object-fit:cover;
aspect-ratio:9/16;
}

#logo{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:140px;
opacity:.35;
display:none;
pointer-events:none;
z-index:10;
}

.sticker{
position:absolute;
left:20px;
top:20px;
font-size:50px;
cursor:move;
display:none;
z-index:999;
user-select:none;
touch-action:none;
}

.sticker-img{
position:absolute;
left:60px;
top:100px;
width:100px;
display:none;
cursor:move;
z-index:999;
touch-action:none;
}

.footer{
text-align:center;
margin-top:12px;
}

.footer a{
color:#60a5fa;
text-decoration:none;
font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

<h1>GKH Photo Editing Pro</h1>

<div class="controls">

<label>Screenshot 1</label>
<input type="file" id="img1" accept="image/*">

<label>Screenshot 2</label>
<input type="file" id="img2" accept="image/*">

<label>Logo Upload</label>
<input type="file" id="logoInput" accept="image/*">

<label>
<input type="checkbox" id="toggleLogo" checked>
Show Logo
</label>

<label>Logo Size</label>
<input type="range" id="logoSize" min="50" max="300" value="140">

<label>Logo Opacity</label>
<input type="range" id="logoOpacity" min="10" max="100" value="35">

<label>Border Color</label>
<select id="borderColor">
<option value="#2563eb">Blue</option>
<option value="#ef4444">Red</option>
<option value="#22c55e">Green</option>
<option value="#eab308">Yellow</option>
<option value="#a855f7">Purple</option>
<option value="#000000">Black</option>
</select>

<label>Background Color</label>
<select id="bgColor">
<option value="#ffffff">White</option>
<option value="#f8fafc">Light Gray</option>
<option value="#dbeafe">Sky Blue</option>
<option value="#dcfce7">Mint Green</option>
<option value="#fef3c7">Cream Yellow</option>
<option value="#f3e8ff">Lavender</option>
<option value="#fee2e2">Soft Pink</option>
<option value="#e5e7eb">Silver</option>
</select>

<label>Emoji Sticker</label>
<select id="emojiSelect">
<option value="">No Emoji</option>
<option>❤️</option>
<option>🔥</option>
<option>⭐</option>
<option>✔️</option>
<option>😊</option>
<option>😍</option>
<option>💚</option>
<option>🕌</option>
<option>☪️</option>
<option>🌙</option>
<option>📌</option>
<option>🎯</option>
</select>

<label>
<input type="checkbox" id="toggleEmoji">
Show Emoji
</label>

<label>Emoji Size</label>
<input type="range" id="emojiSize" min="20" max="200" value="50">

<label>Custom Sticker Image</label>
<input type="file" id="stickerInput" accept="image/*">

<label>Sticker Size</label>
<input type="range" id="stickerSize" min="30" max="400" value="100">

<button onclick="downloadImage()">
PNG Download
</button>

</div>

<div class="preview" id="capture">

<div class="screenshots">

<div class="frame">
<img id="preview1">
</div>

<div class="frame">
<img id="preview2">
</div>

</div>

<img id="logo">

<div id="emojiSticker" class="sticker">
❤️
</div>

<img id="customSticker" class="sticker-img">

</div>

<div class="footer">
<a href="https://www.facebook.com/share/1B8xQqm9Pq/" target="_blank">
By Habibur Rahman
</a>
</div>

</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
  function loadImage(input,target){

input.addEventListener("change",function(){

if(this.files[0]){

const reader=new FileReader();

reader.onload=function(e){

target.src=e.target.result;

};

reader.readAsDataURL(this.files[0]);

}

});

}

loadImage(
document.getElementById("img1"),
document.getElementById("preview1")
);

loadImage(
document.getElementById("img2"),
document.getElementById("preview2")
);

const logo=document.getElementById("logo");
const logoInput=document.getElementById("logoInput");
const logoSize=document.getElementById("logoSize");
const logoOpacity=document.getElementById("logoOpacity");
const toggleLogo=document.getElementById("toggleLogo");

logoInput.addEventListener("change",function(){

if(this.files[0]){

const reader=new FileReader();

reader.onload=function(e){

logo.src=e.target.result;
logo.style.display="block";

};

reader.readAsDataURL(this.files[0]);

}

});

logoSize.addEventListener("input",function(){

logo.style.width=this.value+"px";

});

logoOpacity.addEventListener("input",function(){

logo.style.opacity=this.value/100;

});

toggleLogo.addEventListener("change",function(){

logo.style.display=
this.checked ? "block" : "none";

});

const borderColor=
document.getElementById("borderColor");

borderColor.addEventListener("change",function(){

document
.querySelectorAll(".frame")
.forEach(frame=>{

frame.style.borderColor=
this.value;

});

});

const bgColor=
document.getElementById("bgColor");

bgColor.addEventListener("change",function(){

document
.getElementById("capture")
.style.backgroundColor=
this.value;

});

const emojiSticker=
document.getElementById("emojiSticker");

const emojiSelect=
document.getElementById("emojiSelect");

const toggleEmoji=
document.getElementById("toggleEmoji");

const emojiSize=
document.getElementById("emojiSize");

emojiSelect.addEventListener("change",function(){

emojiSticker.innerHTML=this.value;

if(this.value){

emojiSticker.style.display="block";

}else{

emojiSticker.style.display="none";

}

});

toggleEmoji.addEventListener("change",function(){

if(this.checked && emojiSelect.value){

emojiSticker.style.display="block";

}else{

emojiSticker.style.display="none";

}

});

emojiSize.addEventListener("input",function(){

emojiSticker.style.fontSize=
this.value+"px";

});

const customSticker=
document.getElementById("customSticker");

document
.getElementById("stickerInput")
.addEventListener("change",function(){

if(this.files[0]){

const reader=new FileReader();

reader.onload=function(e){

customSticker.src=e.target.result;

customSticker.style.display="block";

};

reader.readAsDataURL(this.files[0]);

}

});

document
.getElementById("stickerSize")
.addEventListener("input",function(){

customSticker.style.width=
this.value+"px";

});
 function makeDraggable(el){

let startX=0;
let startY=0;
let initialX=0;
let initialY=0;
let dragging=false;

el.addEventListener("mousedown",startDrag);
el.addEventListener("touchstart",startDrag,{passive:false});

function startDrag(e){

dragging=true;

const point=
e.touches ? e.touches[0] : e;

startX=point.clientX;
startY=point.clientY;

initialX=parseInt(el.style.left)||0;
initialY=parseInt(el.style.top)||0;

}

document.addEventListener(
"mousemove",
drag
);

document.addEventListener(
"touchmove",
drag,
{passive:false}
);

function drag(e){

if(!dragging) return;

e.preventDefault();

const point=
e.touches ? e.touches[0] : e;

let x=
initialX+
(point.clientX-startX);

let y=
initialY+
(point.clientY-startY);

el.style.left=x+"px";
el.style.top=y+"px";

}

document.addEventListener(
"mouseup",
stopDrag
);

document.addEventListener(
"touchend",
stopDrag
);

function stopDrag(){

dragging=false;

}

}

makeDraggable(
document.getElementById("emojiSticker")
);

makeDraggable(
document.getElementById("customSticker")
);

function downloadImage(){

html2canvas(
document.getElementById("capture"),
{
scale:3,
useCORS:true,
backgroundColor:null
}
)
.then(function(canvas){

const link=
document.createElement("a");

link.download=
"gkh-photo-editing-pro.png";

link.href=
canvas.toDataURL("image/png");

link.click();

});

}
